name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DERIVED_DATA: build
  SPARKLE_BIN: build/SourcePackages/artifacts/sparkle/Sparkle/bin

jobs:
  build:
    name: Build & test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)"
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Generate project
        run: xcodegen generate

      # Some tests need a real GUI session/GPU (floating video, passkey grid) or the host's macOS URL
      # behaviour, so failures are reported as warnings and the log is uploaded, but don't block a release.
      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test -scheme Browsi -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" > test.log 2>&1 || {
            grep -aE "^✘ Test .* recorded an issue" test.log | sed 's/^/::warning::/' | head -30
            grep -aE "Test run with" test.log
            exit 1
          }
          grep -aE "Test run with" test.log

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build -scheme Browsi -configuration Release -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            > build.log 2>&1 || { grep -aE "error: " build.log | sort -u | head -30; exit 1; }
          grep -aE "^/.*warning: " build.log | sort -u | sed 's/^/::warning::/' | head -30 || true

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$DERIVED_DATA/Build/Products/Release/Browsi.app" \
            "dist/Browsi-${{ steps.version.outputs.version }}.zip"

      - name: Generate appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}" \
            --maximum-versions 1 \
            -o dist/appcast.xml dist
          cat dist/appcast.xml

      - uses: actions/upload-artifact@v7
        with:
          name: Browsi-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure() || steps.test.outcome == 'failure'
        with:
          name: logs
          path: "*.log"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/appcast.xml \
            --title "Browsi ${{ steps.version.outputs.version }}" --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
