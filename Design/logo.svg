<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1A1250"/><stop offset="0.5" stop-color="#0B0A2A"/><stop offset="1" stop-color="#05040F"/>
    </linearGradient>
    <radialGradient id="nebA" cx="0.82" cy="0.2" r="0.55"><stop offset="0" stop-color="#C04BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#C04BFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="nebB" cx="0.12" cy="0.88" r="0.6"><stop offset="0" stop-color="#2E8BFF" stop-opacity="0.45"/><stop offset="1" stop-color="#2E8BFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="nebC" cx="0.55" cy="0.6" r="0.45"><stop offset="0" stop-color="#FF5FA8" stop-opacity="0.16"/><stop offset="1" stop-color="#FF5FA8" stop-opacity="0"/></radialGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <!-- planet (bowl of the b) -->
    <radialGradient id="planet" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.22" stop-color="#B9E6FF"/>
      <stop offset="0.55" stop-color="#7B6BFF"/><stop offset="0.85" stop-color="#3A1F9E"/><stop offset="1" stop-color="#1B0F55"/>
    </radialGradient>
    <radialGradient id="atmo" cx="0.5" cy="0.5" r="0.5"><stop offset="0.78" stop-color="#8FD8FF" stop-opacity="0"/><stop offset="0.9" stop-color="#8FD8FF" stop-opacity="0.55"/><stop offset="1" stop-color="#8FD8FF" stop-opacity="0"/></radialGradient>
    <!-- stem: comet trail, bright at the bottom -->
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9DBFF" stop-opacity="0.35"/><stop offset="0.4" stop-color="#D6E6FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD9F4" stop-opacity="0"/><stop offset="0.25" stop-color="#FFD0EF"/><stop offset="0.6" stop-color="#9FE2FF"/><stop offset="1" stop-color="#9FE2FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <clipPath id="frontHalf"><rect x="0" y="600" width="1200" height="500" transform="rotate(-18 560 600)"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>

  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sky)"/></g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#nebA)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#nebB)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#nebC)"/>
    <circle cx="630" cy="177" r="2.6" fill="#FFE6C8" opacity="0.41"/><circle cx="165" cy="518" r="1.2" fill="#CFE3FF" opacity="0.40"/><circle cx="175" cy="191" r="2.2" fill="#FFE6C8" opacity="0.39"/><circle cx="217" cy="295" r="3.4" fill="#FFFFFF" opacity="0.70"/><circle cx="885" cy="157" r="1.5" fill="#FFFFFF" opacity="0.52"/><circle cx="201" cy="568" r="1.5" fill="#FFE6C8" opacity="0.57"/><circle cx="485" cy="844" r="1.8" fill="#FFFFFF" opacity="0.53"/><circle cx="668" cy="311" r="2.6" fill="#CFE3FF" opacity="0.53"/><circle cx="806" cy="692" r="1.8" fill="#FFFFFF" opacity="0.72"/><circle cx="213" cy="448" r="1.8" fill="#CFE3FF" opacity="0.44"/><circle cx="451" cy="874" r="1.2" fill="#FFE6C8" opacity="0.81"/><circle cx="174" cy="193" r="1.8" fill="#FFFFFF" opacity="0.63"/><circle cx="168" cy="670" r="3.4" fill="#CFE3FF" opacity="0.70"/><circle cx="644" cy="138" r="2.2" fill="#FFE6C8" opacity="0.56"/><circle cx="212" cy="166" r="1.8" fill="#FFFFFF" opacity="0.43"/><circle cx="432" cy="839" r="2.2" fill="#CFE3FF" opacity="0.40"/><circle cx="435" cy="338" r="1.5" fill="#FFE6C8" opacity="0.84"/><circle cx="871" cy="238" r="1.5" fill="#FFFFFF" opacity="0.44"/><circle cx="129" cy="772" r="1.5" fill="#FFFFFF" opacity="0.51"/><circle cx="234" cy="539" r="2.6" fill="#FFFFFF" opacity="0.69"/><circle cx="162" cy="825" r="3.4" fill="#CFE3FF" opacity="0.83"/><circle cx="269" cy="892" r="2.2" fill="#FFFFFF" opacity="0.45"/><circle cx="591" cy="200" r="2.6" fill="#FFFFFF" opacity="0.44"/><circle cx="864" cy="601" r="1.2" fill="#FFE6C8" opacity="0.87"/><circle cx="869" cy="592" r="2.2" fill="#CFE3FF" opacity="0.42"/><circle cx="899" cy="485" r="2.2" fill="#FFFFFF" opacity="0.54"/><circle cx="200" cy="389" r="1.8" fill="#FFFFFF" opacity="0.64"/><circle cx="525" cy="281" r="2.6" fill="#FFE6C8" opacity="0.57"/><circle cx="837" cy="714" r="1.8" fill="#FFFFFF" opacity="0.94"/><circle cx="666" cy="325" r="1.8" fill="#FFFFFF" opacity="0.89"/><circle cx="731" cy="378" r="1.5" fill="#FFFFFF" opacity="0.72"/><circle cx="700" cy="298" r="2.6" fill="#FFFFFF" opacity="0.65"/><circle cx="896" cy="739" r="2.2" fill="#FFE6C8" opacity="0.51"/><circle cx="870" cy="471" r="3.4" fill="#FFFFFF" opacity="0.94"/><circle cx="183" cy="200" r="2.2" fill="#FFFFFF" opacity="0.47"/><circle cx="498" cy="892" r="2.6" fill="#CFE3FF" opacity="0.85"/><circle cx="833" cy="390" r="3.4" fill="#FFFFFF" opacity="0.40"/><circle cx="833" cy="733" r="1.5" fill="#FFFFFF" opacity="0.64"/><circle cx="188" cy="862" r="3.4" fill="#CFE3FF" opacity="0.59"/><circle cx="703" cy="187" r="1.5" fill="#FFFFFF" opacity="0.45"/><circle cx="142" cy="583" r="2.2" fill="#FFFFFF" opacity="0.83"/><circle cx="492" cy="855" r="1.5" fill="#FFFFFF" opacity="0.68"/><circle cx="137" cy="747" r="3.4" fill="#FFE6C8" opacity="0.74"/><circle cx="708" cy="229" r="1.5" fill="#FFFFFF" opacity="0.85"/><circle cx="142" cy="287" r="2.6" fill="#FFE6C8" opacity="0.49"/><circle cx="774" cy="168" r="3.4" fill="#CFE3FF" opacity="0.56"/>
    <!-- shooting star -->
    <path d="M610 170 L800 270" stroke="url(#meteor)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="800" cy="270" r="7" fill="#FFFFFF"/><circle cx="800" cy="270" r="18" fill="#BFE3FF" opacity="0.5" filter="url(#soft)"/>

    <!-- stem glow + comet trail -->
    <rect x="292" y="210" width="76" height="600" rx="38" fill="#9DBBFF" opacity="0.45" filter="url(#glow)"/>
    <rect x="300" y="205" width="60" height="605" rx="30" fill="url(#trail)"/>

    <!-- ring, back half (behind planet) -->
    <ellipse cx="560" cy="600" rx="300" ry="62" transform="rotate(-18 560 600)" fill="none" stroke="url(#ring)" stroke-width="14"/>
    <!-- planet -->
    <circle cx="560" cy="600" r="210" fill="#7FC9FF" opacity="0.35" filter="url(#glow)"/>
    <circle cx="560" cy="600" r="196" fill="url(#planet)"/>
    <circle cx="560" cy="600" r="206" fill="url(#atmo)"/>
    <!-- subtle bands -->
    <path d="M378 640 Q560 600 742 650" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="14" fill="none"/>
    <path d="M392 700 Q560 668 724 712" stroke="#2A1676" stroke-opacity="0.25" stroke-width="18" fill="none"/>
    <!-- ring, front half -->
    <g clip-path="url(#frontHalf)">
      <ellipse cx="560" cy="600" rx="300" ry="62" transform="rotate(-18 560 600)" fill="none" stroke="url(#ring)" stroke-width="14"/>
    </g>
    <!-- planet highlight -->
    <ellipse cx="488" cy="500" rx="58" ry="30" transform="rotate(-35 488 500)" fill="#FFFFFF" opacity="0.55" filter="url(#soft)"/>
    <!-- bright foot of the stem joins the planet -->
    <circle cx="330" cy="790" r="34" fill="#FFFFFF" opacity="0.5" filter="url(#glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>
</svg>