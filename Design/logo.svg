<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <clipPath id="sun"><circle cx="512" cy="512" r="250"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2B1D0E" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Flat warm paper tile -->
  <g filter="url(#drop)"><rect x="100" y="100" width="824" height="824" rx="186" fill="#F3EADB"/></g>
  <g clip-path="url(#sq)">
    <!-- Horizon band -->
    <rect x="100" y="700" width="824" height="230" fill="#E6D8C1"/>
    <!-- Eclipse: coral sun with an ink moon sliding across it -->
    <circle cx="512" cy="512" r="250" fill="#FF5A36"/>
    <g clip-path="url(#sun)">
      <circle cx="590" cy="470" r="232" fill="#16213E"/>
    </g>
    <!-- Orbit path (flat stroke, broken where it passes behind the disc) -->
    <path d="M40 720 C 260 560, 700 400, 846 330" fill="none" stroke="#16213E" stroke-width="26" stroke-linecap="round"/>
    <!-- Satellite dot riding the orbit -->
    <circle cx="846" cy="330" r="42" fill="#FFB23F"/>
  </g>
</svg>
