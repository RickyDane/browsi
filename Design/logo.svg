<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background: Browsi's violet space with a pink and a cyan glow -->
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8A6BFF"/>
      <stop offset="0.55" stop-color="#4B2BD6"/>
      <stop offset="1" stop-color="#1E1366"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.86" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#FF7AD9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF7AD9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.08" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#3FD4FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3FD4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>

    <!-- Glass glyph -->
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="300" y1="220" x2="760" y2="800">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F1ECFF"/>
      <stop offset="1" stop-color="#C9BEFF"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#8FE3FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF8BE0" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#12083F" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Squircle -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glowPink)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glowCyan)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>

  <!-- "b": the stem is the vertical tab sidebar, the bowl a glass lens onto the web -->
  <g filter="url(#lift)">
    <!-- lens fill inside the bowl -->
    <circle cx="560" cy="585" r="112" fill="url(#lens)"/>
    <g fill="url(#glass)">
      <rect x="268" y="226" width="116" height="574" rx="58"/>
      <path fill-rule="evenodd" d="M560 377 a208 208 0 1 1 0 416 a208 208 0 1 1 0 -416 Z
                                    M560 473 a112 112 0 1 0 0 224 a112 112 0 1 0 0 -224 Z"/>
    </g>
  </g>
  <!-- tab rows etched into the stem -->
  <g fill="#5A3CE0" fill-opacity="0.28">
    <rect x="300" y="282" width="52" height="16" rx="8"/>
    <rect x="300" y="322" width="52" height="16" rx="8"/>
    <rect x="300" y="362" width="38" height="16" rx="8"/>
  </g>
  <!-- glass highlights -->
  <path d="M410 520 a160 160 0 0 1 120 -118" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#soft)"/>
  <ellipse cx="520" cy="540" rx="34" ry="18" transform="rotate(-35 520 540)" fill="#FFFFFF" opacity="0.55" filter="url(#soft)"/>

  <!-- AI sparkle -->
  <g transform="translate(748 300)">
    <path d="M0 -62 C8 -16 16 -8 62 0 C16 8 8 16 0 62 C-8 16 -16 8 -62 0 C-16 -8 -8 -16 0 -62 Z" fill="#FFFFFF"/>
    <circle r="16" fill="#FFFFFF" opacity="0.6" filter="url(#soft)"/>
  </g>
  <g transform="translate(818 404) scale(0.38)">
    <path d="M0 -62 C8 -16 16 -8 62 0 C16 8 8 16 0 62 C-8 16 -16 8 -62 0 C-16 -8 -8 -16 0 -62 Z" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
