name: Browsi
options:
  bundleIdPrefix: dev.perlick
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Browsi:
    type: application
    platform: macOS
    sources:
      - path: Browsi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.perlick.browsi
        PRODUCT_NAME: Browsi
        INFOPLIST_FILE: Browsi/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Browsi/Resources/Browsi.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  BrowsiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BrowsiTests
    dependencies:
      - target: Browsi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Browsi.app/Contents/MacOS/Browsi"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
schemes:
  Browsi:
    build:
      targets:
        Browsi: all
        BrowsiTests: [test]
    test:
      targets:
        - BrowsiTests
    run:
      config: Debug
